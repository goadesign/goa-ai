# MCP Protocol Compliance Test Scenarios (new shape)

scenarios:
  - name: initialize_basic
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: initialize
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "test-client", version: "1.0.0" }
        expect:
          status: success
          result:
            protocolVersion: "2025-06-18"

  - name: initialize_negotiates_version
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: initialize_different_client_version
        op: Initialize
        input:
          protocolVersion: "1.0.0"
          capabilities: {}
          clientInfo: { name: "test-client", version: "1.0.0" }
        expect:
          status: success
          result:
            protocolVersion: "2025-06-18"

  - name: initialize_twice
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: init1
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "test-client", version: "1.0.0" }
        expect:
          status: success
          result: { protocolVersion: "2025-06-18" }
      - name: init2
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "test-client", version: "1.0.0" }
        expect:
          status: success
          result: { protocolVersion: "2025-06-18" }

  - name: invalid_method
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: invalid_op
        op: InvalidOp
        input: {}
        expect:
          status: error
          error: { code: -32601, message: "Method not found" }

  - name: initialize_missing_version
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: init_missing
        op: Initialize
        input:
          capabilities: {}
          clientInfo: { name: "t", version: "1" }
        expect:
          status: error
          error: { code: -32602 }

  - name: initialize_fields
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: init_fields
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "runner", version: "1.0.0" }
        expect:
          status: success
          result:
            serverInfo: { name: "assistant-mcp", version: "1.0.0" }
            capabilities: {}

  - name: initialized_notification_has_no_response
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: initialize
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "test-client", version: "1.0.0" }
        expect:
          status: success
      - name: initialized_notification
        op: NotificationsInitialized
        input: {}
        notification: true
        expect:
          status: no_response

  - name: ping_basic
    defaults:
      client: jsonrpc.mcp_assistant
    pre:
      auto_initialize: false
    steps:
      - name: ping
        op: Ping
        input: {}
        expect:
          status: success
