scenarios:
  - name: stateless_discovery
    steps:
      - name: catalog_before_discovery
        op: ToolsList
        expect:
          status: success
          result: { resultType: complete, ttlMs: 0, cacheScope: private }
      - name: discover
        op: ServerDiscover
        expect:
          status: success
          result:
            resultType: complete
            supportedVersions: ["2026-07-28"]
            capabilities: { tools: {}, resources: {}, prompts: {} }
            ttlMs: 0
            cacheScope: private
      - name: catalog_after_discovery
        op: ToolsList
        expect:
          status: success
          result: { resultType: complete }
  - name: missing_metadata
    steps:
      - op: ToolsList
        input: { _meta: null }
        expect: { status: error, error: { code: -32602 } }
  - name: unsupported_version
    steps:
      - op: ToolsList
        input:
          _meta:
            io.modelcontextprotocol/protocolVersion: "2025-06-18"
            io.modelcontextprotocol/clientCapabilities: {}
        headers: { MCP-Protocol-Version: "2025-06-18" }
        expect: { status: error, error: { code: -32022 } }
  - name: header_mismatch
    steps:
      - op: ToolsList
        headers: { MCP-Method: "tools/call" }
        expect: { status: error, error: { code: -32020 } }
  - name: unknown_method
    steps:
      - op: unknown/method
        expect: { status: error, error: { code: -32601 } }
  - name: removed_initialize
    steps:
      - op: initialize
        expect: { status: error, error: { code: -32601 } }
