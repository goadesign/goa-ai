scenarios:
  - name: initialize_handshake
    pre:
      auto_initialize: false
    steps:
      - name: initialize
        op: Initialize
        input:
          protocolVersion: "2025-06-18"
          capabilities: {}
          clientInfo: { name: "integration-runner", version: "1.0.0" }
        expect:
          status: success
          result:
            protocolVersion: "2025-06-18"
            serverInfo: { name: "assistant-mcp", version: "1.0.0" }
            capabilities:
              tools: {}
              resources: {}
              prompts: {}
      - name: initialized_notification
        op: NotificationsInitialized
        expect:
          status: success
      - name: ping_with_negotiated_version
        op: Ping
        expect:
          status: success

  - name: initialize_missing_version
    pre:
      auto_initialize: false
    steps:
      - name: initialize
        op: Initialize
        input:
          capabilities: {}
          clientInfo: { name: "integration-runner", version: "1.0.0" }
        expect:
          status: error
          error: { code: -32602 }

  - name: unknown_jsonrpc_method
    pre:
      auto_initialize: true
    steps:
      - name: call_unknown_method
        op: unknown/method
        input: {}
        expect:
          status: error
          error: { code: -32601 }
