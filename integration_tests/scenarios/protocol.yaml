scenarios:
  - name: stateless_discovery
    steps:
      - name: catalog_before_discovery
        op: ToolsList
        expect:
          status: success
          result: { resultType: complete, ttlMs: 0, cacheScope: private }
      - name: discover
        op: ServerDiscover
        expect:
          status: success
          result:
            resultType: complete
            supportedVersions: ["2026-07-28", "2025-11-25"]
            capabilities: { tools: {}, resources: {}, prompts: {} }
            ttlMs: 0
            cacheScope: private
      - name: catalog_after_discovery
        op: ToolsList
        expect:
          status: success
          result: { resultType: complete }
  - name: missing_metadata
    steps:
      - op: ToolsList
        input: { _meta: null }
        expect: { status: error, error: { code: -32602 } }
  - name: unsupported_version
    steps:
      - op: ToolsList
        input:
          _meta:
            io.modelcontextprotocol/protocolVersion: "2025-06-18"
            io.modelcontextprotocol/clientCapabilities: {}
        headers: { MCP-Protocol-Version: "2025-06-18" }
        expect: { status: error, error: { code: -32022 } }
  - name: header_mismatch
    steps:
      - op: ToolsList
        headers: { MCP-Method: "tools/call" }
        expect: { status: error, error: { code: -32020 } }
  - name: unknown_method
    steps:
      - op: unknown/method
        expect: { status: error, error: { code: -32601 } }
  - name: initialize_rejects_modern_metadata
    steps:
      - op: initialize
        expect: { status: error, error: { code: -32602 } }
  - name: basic_older_client
    defaults:
      headers: { MCP-Protocol-Version: "2025-11-25" }
    steps:
      - op: initialize
        input:
          _meta: {}
          protocolVersion: "2025-11-25"
          capabilities: {}
          clientInfo: { name: "integration-runner", version: "1.0.0" }
        expect:
          status: success
          result:
            protocolVersion: "2025-11-25"
            capabilities: { tools: {}, resources: {}, prompts: {} }
      - op: ToolsList
        input: { _meta: {} }
        expect: { status: success }
      - op: ping
        input: { _meta: {} }
        expect: { status: success, result: {} }
