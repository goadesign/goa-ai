# MCP tool scenarios use the Accept value required by the 2025-06-18 protocol.

scenarios:
  - name: tools_list
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        input: {}
        expect:
          status: success
          result:
            tools: [ { name: "analyze_sentiment" }, { name: "extract_keywords" }, { name: "summarize_text" }, { name: "search" }, { name: "execute_code" }, { name: "process_batch" } ]

  - name: tools_list_schema
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        input: {}
        expect:
          status: success
          result:
            tools:
              - name: analyze_sentiment
                inputSchema:
                  type: object
                  required: [ "text" ]
                  properties:
                    text:
                      type: string
                      description: "Input text to analyze"

  - name: tools_list_rejects_cursor
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        input: { cursor: "not-issued-by-this-server" }
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_analyze_sentiment
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: analyze_sentiment
          arguments: { text: "I love this new feature! It works perfectly." }
        expect:
          status: success

  - name: tool_analyze_sentiment_empty_text
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: analyze_sentiment
          arguments: { text: "" }
        expect:
          status: success

  - name: tool_extract_keywords
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: extract_keywords
          arguments: { text: "Machine learning algorithms process data to identify patterns." }
        expect:
          status: success

  - name: tool_summarize_text
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: summarize_text
          arguments: { text: "This is a long text that needs to be summarized." }
        expect:
          status: success

  - name: tool_search
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: search
          arguments: { query: "MCP protocol", limit: 5 }
        expect:
          status: success

  - name: tool_search_default_limit
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: search
          arguments: { query: "test query" }
        expect:
          status: success

  - name: tool_execute_code_python
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: execute_code
          arguments: { language: python, code: "print(2 + 2)" }
        expect:
          status: success

  - name: tool_execute_code_javascript
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: execute_code
          arguments: { language: javascript, code: "console.log(Math.pow(2, 3))" }
        expect:
          status: success

  - name: tool_execute_code_invalid_language
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: execute_code
          arguments: { language: ruby, code: "puts 1" }
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_call_unknown_tool
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: non_existent_tool
          arguments: {}
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_call_missing_required_field
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: analyze_sentiment
          arguments: {}
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_call_invalid_argument_type
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: search
          arguments: { query: "test", limit: "not a number" }
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_call_invalid_enum
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["x"], format: invalid }
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_call_malformed_arguments
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: analyze_sentiment
          arguments: "not-json-object"
        expect:
          status: error
          error: { code: -32602 }

  - name: tool_process_batch_json
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["item1", "item2", "item3"] }
        expect:
          status: success

  - name: tool_process_batch_text
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["item1", "item2"], format: text }
        expect:
          status: success

  - name: tool_process_batch_blob
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["a", "b"], format: blob, blob: "aGVsbG8=", mimeType: "text/plain" }
        expect:
          status: success

  - name: tool_process_batch_uri
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["x"], format: uri, uri: "system://info", mimeType: "application/json" }
        expect:
          status: success
