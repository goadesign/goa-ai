scenarios:
  - name: tools_list
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        expect:
          status: success
          result:
            tools:
              - { name: "analyze_sentiment" }
              - { name: "extract_keywords" }
              - { name: "summarize_text" }
              - { name: "search" }
              - { name: "execute_code" }
              - { name: "process_batch" }

  - name: tools_list_schema
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        input: {}
        expect:
          status: success
          result:
            tools:
              - name: analyze_sentiment
                inputSchema:
                  type: object
                  required: [ "text" ]
                  properties:
                    text:
                      type: string
                      description: "Input text to analyze"
              - { name: "extract_keywords" }
              - { name: "summarize_text" }
              - { name: "search" }
              - { name: "execute_code" }
              - { name: "process_batch" }

  - name: tools_call_each_unary_method
    pre:
      auto_initialize: true
    steps:
      - name: analyze_sentiment
        op: ToolsCall
        input:
          name: analyze_sentiment
          arguments: { text: "The generated server works." }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"sentiment":"positive"}' } ]
            structuredContent: { sentiment: positive }
      - name: extract_keywords
        op: ToolsCall
        input:
          name: extract_keywords
          arguments: { text: "MCP exposes typed tools." }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"keywords":["MCP","typed","tools"]}' } ]
            structuredContent: { keywords: [MCP, typed, tools] }
      - name: summarize_text
        op: ToolsCall
        input:
          name: summarize_text
          arguments: { text: "This text is summarized by the fixture." }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"summary":"The fixture returns a stable generated response."}' } ]
            structuredContent: { summary: "The fixture returns a stable generated response." }
      - name: search
        op: ToolsCall
        input:
          name: search
          arguments: { query: "MCP protocol", limit: 5 }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"results":["MCP protocol reference","Generated tool guide"]}' } ]
            structuredContent: { results: ["MCP protocol reference", "Generated tool guide"] }
      - name: execute_code
        op: ToolsCall
        input:
          name: execute_code
          arguments: { language: python, code: "print(2 + 2)" }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"output":"4"}' } ]
            structuredContent: { output: "4" }
      - name: process_batch
        op: ToolsCall
        input:
          name: process_batch
          arguments: { items: ["first", "second"], format: json }
        expect:
          status: success
          result:
            content: [ { type: text, text: '{"ok":true}' } ]
            structuredContent: { ok: true }

  - name: tools_list_rejects_cursor
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ToolsList
        input: { cursor: "next" }
        expect:
          status: error
          error: { code: -32602 }

  - name: tools_call_rejects_unknown_name
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input: { name: "unknown_tool", arguments: {} }
        expect:
          status: error
          error: { code: -32602 }

  - name: tools_call_rejects_missing_required_field
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input: { name: "analyze_sentiment", arguments: {} }
        expect:
          status: error
          error: { code: -32602 }

  - name: tools_call_rejects_invalid_argument_type
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: search
          arguments: { query: "MCP", limit: "five" }
        expect:
          status: error
          error: { code: -32602 }

  - name: tools_call_rejects_invalid_enum
    pre:
      auto_initialize: true
    steps:
      - name: call
        op: ToolsCall
        input:
          name: execute_code
          arguments: { language: ruby, code: "puts 4" }
        expect:
          status: error
          error: { code: -32602 }
