scenarios:
  - name: resources_list
    steps:
      - name: list
        op: ResourcesList
        expect:
          status: success
          result:
            resources:
              - { uri: "doc://list", name: "documents", mimeType: "application/json" }
              - { uri: "system://info", name: "system_info", mimeType: "application/json" }
              - { uri: "test://empty-binary", name: "empty_binary", mimeType: "application/octet-stream" }
              - { uri: "test://static-binary", name: "binary", mimeType: "image/png" }

  - name: resources_read_documents
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "doc://list" }
        expect:
          status: success
          result:
            contents:
              - { uri: "doc://list", mimeType: "application/json", text: '{"items":["guide.md","reference.md"]}' }

  - name: resources_read_system_info
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "system://info" }
        expect:
          status: success
          result:
            contents:
              - { uri: "system://info", mimeType: "application/json", text: '{"name":"assistant","version":"1.0.0"}' }

  - name: resources_list_rejects_cursor
    steps:
      - name: list
        op: ResourcesList
        input: { cursor: "next" }
        expect:
          status: error
          error: { code: -32602 }

  - name: resources_read_unknown_uri
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "unknown://resource" }
        expect:
          status: error
          error: { code: -32602 }

  - name: resources_read_binary
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "test://static-binary" }
        expect:
          status: success
          result:
            contents:
              - { uri: "test://static-binary", mimeType: "image/png", blob: "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAIAAACQd1PeAAAADElEQVR4nGNgYGAAAAAEAAH2FzhVAAAAAElFTkSuQmCC" }

  - name: resources_read_empty_binary
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "test://empty-binary" }
        expect:
          status: success
          result:
            contents:
              - { uri: "test://empty-binary", mimeType: "application/octet-stream", blob: "" }
