scenarios:
  - name: resources_list
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ResourcesList
        expect:
          status: success
          result:
            resources:
              - { uri: "doc://list", name: "documents", mimeType: "application/json" }
              - { uri: "system://info", name: "system_info", mimeType: "application/json" }

  - name: resources_read_documents
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "doc://list" }
        expect:
          status: success
          result:
            contents:
              - { uri: "doc://list", mimeType: "application/json", text: '{"items":["guide.md","reference.md"]}' }

  - name: resources_read_system_info
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "system://info" }
        expect:
          status: success
          result:
            contents:
              - { uri: "system://info", mimeType: "application/json", text: '{"name":"assistant","version":"1.0.0"}' }

  - name: resources_list_rejects_cursor
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ResourcesList
        input: { cursor: "next" }
        expect:
          status: error
          error: { code: -32602 }

  - name: resources_read_unknown_uri
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "unknown://resource" }
        expect:
          status: error
          error: { code: -32602 }
