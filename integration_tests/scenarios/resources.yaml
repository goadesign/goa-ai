# MCP resource scenarios verify fixed resource reads and access rules.

scenarios:
  - name: resources_list
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ResourcesList
        input: {}
        expect:
          status: success
          result: { resources: [ {} ] }

  - name: resources_list_rejects_cursor
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: ResourcesList
        input: { cursor: "not-issued-by-this-server" }
        expect:
          status: error
          error: { code: -32602 }

  - name: resources_read_system
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "system://info" }
        expect:
          status: success
          result:
            contents: [ { uri: "system://info", mimeType: "application/json", text: "{}" } ]

  - name: resources_read_conversation
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "conversation://history" }
        expect:
          status: success
          result:
            contents:
              - uri: "conversation://history"
                mimeType: "application/json"
                text: "{}"

  - name: resources_read_unknown_resource
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: read
        op: ResourcesRead
        input: { uri: "invalid://resource" }
        expect:
          status: error
          error: { code: -32602 }
