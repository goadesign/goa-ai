scenarios:
  - name: prompts_list
    steps:
      - name: list
        op: PromptsList
        expect:
          status: success
          result:
            prompts:
              - { name: "code_review", description: "Simple code review prompt" }

  - name: prompts_get_static
    steps:
      - name: get
        op: PromptsGet
        input: { name: "code_review" }
        expect:
          status: success
          result:
            description: "Simple code review prompt"
            messages:
              - role: user
                content:
                  type: text
                  text: "Review the provided code and suggest improvements."

  - name: prompts_get_rejects_arguments
    steps:
      - name: get
        op: PromptsGet
        input:
          name: "code_review"
          arguments: { code: "package main" }
        expect:
          status: error
          error: { code: -32602 }

  - name: prompts_list_rejects_cursor
    steps:
      - name: list
        op: PromptsList
        input: { cursor: "next" }
        expect:
          status: error
          error: { code: -32602 }

  - name: prompts_get_unknown_name
    steps:
      - name: get
        op: PromptsGet
        input: { name: "unknown_prompt" }
        expect:
          status: error
          error: { code: -32602 }
