# MCP prompt scenarios verify static prompt selection and argument rejection.

scenarios:
  - name: prompts_list
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: PromptsList
        input: {}
        expect:
          status: success
          result:
            prompts:
              - name: code_review

  - name: prompts_list_rejects_cursor
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: list
        op: PromptsList
        input: { cursor: "not-issued-by-this-server" }
        expect:
          status: error
          error: { code: -32602 }

  - name: prompts_get_static_without_arguments
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: get
        op: PromptsGet
        input:
          name: code_review
        expect:
          status: success

  - name: prompts_get_static_with_empty_arguments
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: get
        op: PromptsGet
        input:
          name: code_review
          arguments: {}
        expect:
          status: success

  - name: prompts_get_static_rejects_arguments
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: get
        op: PromptsGet
        input:
          name: code_review
          arguments: { code: "func add(a, b int) int { return a + b }" }
        expect:
          status: error
          error: { code: -32602 }

  - name: prompts_get_unknown_prompt
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: get
        op: PromptsGet
        input: { name: non_existent_prompt, arguments: {} }
        expect:
          status: error
          error: { code: -32602 }

  - name: prompts_get_missing_name
    defaults:
      client: jsonrpc.mcp_assistant
      headers:
        Accept: "application/json, text/event-stream"
    pre:
      auto_initialize: true
    steps:
      - name: get
        op: PromptsGet
        input: {}
        expect:
          status: error
          error: { code: -32602 }
