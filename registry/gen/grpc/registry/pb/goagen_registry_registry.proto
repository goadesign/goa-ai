	// Global transport identity stamped on the claimed call.
	optional string tool_use_id = 6;
	// Pulse request-stream event claimed by this provider.
	optional string request_event_id = 7;
}

message PublishToolOutputDeltaResponse {
}

message ReportToolCallOverloadRequest {
	// Toolset whose provider claimed the call.
	optional string toolset = 1;
	// Stable identity of the provider process.
	optional string provider_id = 2;
	// Runtime UUID of the exact Serve lifecycle.
	optional string provider_incarnation_id = 3;
	// Exact registration token of the provider lease.
	optional string provider_registration_token = 4;
	// Admission token stamped on the claimed call.
	optional string call_registration_token = 5;
	// Global transport identity stamped on the claimed call.
	optional string tool_use_id = 6;
	// Pulse request-stream event claimed by this provider.
