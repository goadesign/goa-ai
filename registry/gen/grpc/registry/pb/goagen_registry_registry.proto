message CallToolRequest {
	// Toolset registration identifier used for routing (for example,
// "catalog.lookup").
	optional string toolset = 1;
	// Globally unique tool identifier of the form "toolset.tool" (for example,
// "catalog.lookup.find_records").
	optional string tool = 2;
	// Canonical JSON payload for the tool call. Must validate against the
// registered payload schema.
	optional bytes payload_json = 3;
	// Execution metadata propagated alongside the tool call.
	ToolCallMeta meta = 4;
	// Required runtime-owned version of the consumer message envelope. The
// registry accepts only its exact canonical version.
	optional sint32 wire_protocol_version = 5;
}
// Context metadata propagated alongside tool calls for routing, correlation,
// and domain injection (for example, session-scoped data access).
message ToolCallMeta {
	// Run identifier for the agent execution that issued this tool call.
	optional string run_id = 1;
	// Session identifier when the execution belongs to a session; omitted for
// standalone executions.
	optional string session_id = 2;
	// Turn identifier within the session.
	optional string turn_id = 3;
	// Tool call identifier used for correlation with model provider tool calls.
	optional string tool_call_id = 4;
	// Parent tool call identifier when the tool call is nested.
	optional string parent_tool_call_id = 5;
	// Run labels and runtime-supplied values fixed for this call. Providers use
// them to fill fields declared with Inject; models never see them.
	map<string, string> labels = 6;
	// Accepted execution restriction prohibiting UI output or external interaction.
	optional bool text_only = 7;
	// Sequence of the runtime-selected operation on this tool invocation. Zero
// identifies the original tool call; each new continuation advances it, while
// repeated delivery retains the same sequence.
	optional uint64 execution_sequence = 8;
	// The exact runtime-selected operation and its data; absent on the original
// tool call.
	ToolOperationExecutionContinuation execution_continuation = 9;
}
// One runtime-selected operation on the unfinished original tool invocation.
// Its explicit branch determines the method; field presence never chooses
// whether to query, answer or cancel.
message ToolOperationExecutionContinuation {
	oneof operation {
		// Continue the original tool invocation with accepted host answers and saved
// service state.
	ToolOperationInputContinuation input = 1;
		// Read one existing Task by its exact server-owned identifier.
	string task_get = 2;
		// Submit accepted host answers to one existing Task.
	ToolOperationTaskAnswers task_update = 3;
		// Request cancellation of one existing Task without repeating the original
// tool call.
	string task_cancel = 4;
	}
}
// Exact service state and accepted host answers for continuing the original
// tool invocation.
message ToolOperationInputContinuation {
	// Opaque state returned by the service, including an explicitly empty string.
	optional string state = 1;
	// Host answer JSON bytes keyed by the exact server request identifiers.
	map<string, bytes> responses = 2;
}
// Accepted host answers for one existing Task. An empty answer object is valid
// and does not select a different operation.
message ToolOperationTaskAnswers {
	// Exact server-owned Task identifier, including an empty string.
	optional string task_id = 1;
	// Host answer JSON bytes for outstanding Task input requests.
	map<string, bytes> responses = 2;
}

message CallToolResponse {
	// Global transport identifier derived from required run_id and tool_call_id.
	optional string tool_use_id = 1;
	// Exact admission-generation token stamped on the routed call
	optional string registration_token = 2;
	// Absolute Redis-owned deadline that bounds provider execution and caller
// waiting.
	optional string execution_deadline = 3;
	// Later absolute Redis-owned expiration shared by the call record and result
// stream.
	optional string result_stream_expires_at = 4;
}

message CallResolvedToolRequest {
	// Exact registration returned with the definition used to select this call.
	optional string expected_registration_token = 100;
	// Toolset registration identifier used for routing (for example,
// "catalog.lookup").
	optional string toolset = 1;
	// Globally unique tool identifier of the form "toolset.tool" (for example,
// "catalog.lookup.find_records").
	optional string tool = 2;
	// Canonical JSON payload for the tool call. Must validate against the
// registered payload schema.
	optional bytes payload_json = 3;
	// Execution metadata propagated alongside the tool call.
	ToolCallMeta meta = 4;
	// Required runtime-owned version of the consumer message envelope. The
// registry accepts only its exact canonical version.
	optional sint32 wire_protocol_version = 5;
}

message CallResolvedToolResponse {
	// Global transport identifier derived from required run_id and tool_call_id.
	optional string tool_use_id = 1;
	// Exact admission-generation token stamped on the routed call
	optional string registration_token = 2;
	// Absolute Redis-owned deadline that bounds provider execution and caller
// waiting.
	optional string execution_deadline = 3;
	// Later absolute Redis-owned expiration shared by the call record and result
// stream.
	optional string result_stream_expires_at = 4;
}

