swagger: "2.0"
info:
    title: ""
    description: Read protected-resource and issuer metadata and obtain resource-bound access tokens without exposing credentials to MCP tools.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /issuer:
        get:
            tags:
                - issuer_metadata
            summary: read issuer_metadata
            description: Read issuer metadata and bind it to the exact configured issuer before sending a secret to its token endpoint.
            operationId: issuer_metadata#read
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IssuerMetadataReadResponseBody'
                        required:
                            - issuer
                            - token_endpoint
            schemes:
                - http
    /resource:
        get:
            tags:
                - resource_metadata
            summary: read resource_metadata
            description: Read the resource's metadata before choosing an issuer or sending a client credential.
            operationId: resource_metadata#read
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ResourceMetadataReadResponseBody'
                        required:
                            - resource
                            - authorization_servers
            schemes:
                - http
    /token:
        post:
            tags:
                - access_tokens
            summary: secret access_tokens
            description: Exchange a preregistered client identifier and secret using request-body authentication for one resource and its configured permissions.
            operationId: access_tokens#secret
            parameters:
                - name: SecretRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AccessTokensSecretRequestBody'
                    required:
                        - client_id
                        - client_secret
                        - resource
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/AccessTokensSecretResponseBody'
                        required:
                            - access_token
                            - token_type
            schemes:
                - http
definitions:
    AccessTokensSecretRequestBody:
        title: AccessTokensSecretRequestBody
        type: object
        properties:
            client_id:
                type: string
                description: Client identifier registered with this issuer
                example: "6"
                minLength: 1
            client_secret:
                type: string
                description: Secret registered with this issuer
                example: ehj
                minLength: 1
            resource:
                type: string
                description: Exact resource for which the token is requested
                example: http://senger.name/antwan_rath
                format: uri
            scope:
                type: string
                description: Space-separated permissions requested by the configured client
                example: lk D G
                pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
        example:
            client_id: "6"
            client_secret: ehj
            resource: http://senger.name/antwan_rath
            scope: lk D G
        required:
            - client_id
            - client_secret
            - resource
    AccessTokensSecretResponseBody:
        title: AccessTokensSecretResponseBody
        type: object
        properties:
            access_token:
                type: string
                description: Opaque bearer token returned by the issuer
                example: lw2
                pattern: ^[A-Za-z0-9._~+/-]+=*$
                minLength: 1
            expires_in:
                type: integer
                description: Token lifetime in seconds from the token response
                example: 8271034756713473025
                format: int64
                minimum: 0
            scope:
                type: string
                description: Space-separated permissions granted by the issuer
                example: '}O %'
                pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
            token_type:
                type: string
                description: Bearer token type, compared without case sensitivity
                example: BEARER
                pattern: ^[Bb][Ee][Aa][Rr][Ee][Rr]$
        example:
            access_token: lw2
            expires_in: 8271034756713473025
            scope: '}O %'
            token_type: BEARER
        required:
            - access_token
            - token_type
    IssuerMetadataReadResponseBody:
        title: IssuerMetadataReadResponseBody
        type: object
        properties:
            grant_types_supported:
                type: array
                items:
                    type: string
                    example: Qui voluptatem.
                description: Token grants supported by the issuer
                example:
                    - Qui voluptatem.
                    - Laboriosam itaque laudantium.
                    - Sed laboriosam voluptatibus earum autem doloremque natus.
                    - Similique vel est.
            issuer:
                type: string
                description: Exact identifier of the authorization server
                example: http://connelly.com/jane.volkman
                format: uri
            token_endpoint:
                type: string
                description: HTTPS endpoint that accepts token grants
                example: http://rempel.info/casey_ankunding
                format: uri
            token_endpoint_auth_methods_supported:
                type: array
                items:
                    type: string
                    example: Maxime est aut eius optio.
                description: Client authentication methods accepted at the token endpoint
                example:
                    - Maxime est aut eius optio.
                    - Non dicta architecto a voluptas ipsum et.
        example:
            grant_types_supported:
                - Qui voluptatem.
                - Laboriosam itaque laudantium.
                - Sed laboriosam voluptatibus earum autem doloremque natus.
                - Similique vel est.
            issuer: http://connelly.com/jane.volkman
            token_endpoint: http://rempel.info/casey_ankunding
            token_endpoint_auth_methods_supported:
                - Maxime est aut eius optio.
                - Non dicta architecto a voluptas ipsum et.
        required:
            - issuer
            - token_endpoint
    ResourceMetadataReadResponseBody:
        title: ResourceMetadataReadResponseBody
        type: object
        properties:
            authorization_servers:
                type: array
                items:
                    type: string
                    example: http://wiegand.org/faustino_graham
                    format: uri
                description: Issuers trusted by this resource
                example:
                    - http://wiegand.org/faustino_graham
                    - http://green.net/maeve.torphy
                    - http://lueilwitz.name/wiley_ferry
                minItems: 1
            resource:
                type: string
                description: Exact identifier of the protected resource
                example: http://torphycummerata.info/joey
                format: uri
            scopes_supported:
                type: array
                items:
                    type: string
                    example: Distinctio tempora aut amet rem dolores.
                description: Permissions supported by this resource
                example:
                    - Distinctio tempora aut amet rem dolores.
                    - Mollitia soluta.
        example:
            authorization_servers:
                - http://wiegand.org/faustino_graham
                - http://green.net/maeve.torphy
                - http://lueilwitz.name/wiley_ferry
            resource: http://torphycummerata.info/joey
            scopes_supported:
                - Distinctio tempora aut amet rem dolores.
                - Mollitia soluta.
        required:
            - resource
            - authorization_servers
