swagger: "2.0"
info:
    title: ""
    description: Read protected-resource and issuer metadata and obtain resource-bound access tokens without exposing credentials to MCP tools.
    version: 0.0.1
host: localhost:80
consumes:
    - application/json
    - application/xml
    - application/gob
produces:
    - application/json
    - application/xml
    - application/gob
paths:
    /assertion:
        post:
            tags:
                - access_tokens
            summary: assertion access_tokens
            description: Authenticate a preregistered client using one signed JWT assertion and request a bearer token for the exact MCP resource.
            operationId: access_tokens#assertion
            consumes:
                - application/x-www-form-urlencoded
            parameters:
                - name: resource
                  in: formData
                  description: Exact resource for which the token is requested
                  required: true
                  type: string
                  format: uri
                - name: client_assertion
                  in: formData
                  description: Signed compact JWT identifying the registered client
                  required: true
                  type: string
                  pattern: ^[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+$
                - name: scope
                  in: formData
                  description: Space-separated permissions requested by the configured client
                  required: false
                  type: string
                  pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
                - name: grant_type
                  in: formData
                  description: Client-credentials grant selected by this operation
                  required: false
                  type: string
                  default: client_credentials
                  enum:
                    - client_credentials
                - name: client_assertion_type
                  in: formData
                  description: JWT client authentication selected by this operation
                  required: false
                  type: string
                  default: urn:ietf:params:oauth:client-assertion-type:jwt-bearer
                  enum:
                    - urn:ietf:params:oauth:client-assertion-type:jwt-bearer
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BearerToken'
                        required:
                            - access_token
                            - token_type
            schemes:
                - http
    /callback:
        get:
            tags:
                - authorization_responses
            summary: receive authorization_responses
            description: Decode one host-delivered redirect using the same Goa query validation as a mounted HTTP callback.
            operationId: authorization_responses#receive
            parameters:
                - name: code
                  in: query
                  description: Authorization code returned by the selected issuer
                  required: false
                  type: string
                  minLength: 1
                  pattern: ^[\x20-\x7e]+$
                - name: error
                  in: query
                  description: OAuth error from the selected issuer
                  required: false
                  type: string
                  pattern: ^[\x20\x21\x23-\x5b\x5d-\x7e]+$
                - name: state
                  in: query
                  description: Client-generated value identifying this authorization exchange
                  required: true
                  type: string
                  minLength: 1
                - name: iss
                  in: query
                  description: Exact authorization server identifier when supplied
                  required: false
                  type: string
                  format: uri
            responses:
                "204":
                    description: No Content response.
            schemes:
                - http
    /claims:
        post:
            tags:
                - access_token_claims
            summary: decode access_token_claims
            description: Validate the signed claims using exact JSON names and preserve fractional Unix timestamps.
            operationId: access_token_claims#decode
            parameters:
                - name: DecodeRequestBody
                  in: body
                  required: true
                  schema:
                    $ref: '#/definitions/AccessTokenClaimsDecodeRequestBody'
                    required:
                        - iss
                        - sub
                        - aud
                        - exp
                        - iat
                        - jti
                        - client_id
            responses:
                "204":
                    description: No Content response.
            schemes:
                - http
    /client:
        get:
            tags:
                - client_metadata
            summary: read client_metadata
            description: Check the client's document identity, public authentication and registered redirects before beginning browser consent.
            operationId: client_metadata#read
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ClientMetadataReadResponseBody'
                        required:
                            - client_id
                            - client_name
                            - redirect_uris
                            - token_endpoint_auth_method
            schemes:
                - http
    /code:
        post:
            tags:
                - access_tokens
            summary: code access_tokens
            description: Exchange one validated browser authorization code using the private PKCE verifier and the original resource and redirect.
            operationId: access_tokens#code
            consumes:
                - application/x-www-form-urlencoded
            parameters:
                - name: client_id
                  in: formData
                  description: Public client identifier registered with the selected issuer
                  required: true
                  type: string
                  minLength: 1
                - name: code
                  in: formData
                  description: Authorization code from the validated redirect
                  required: true
                  type: string
                  minLength: 1
                  pattern: ^[\x20-\x7e]+$
                - name: code_verifier
                  in: formData
                  description: Private PKCE verifier for this authorization exchange
                  required: true
                  type: string
                  pattern: ^[A-Za-z0-9._~-]{43,128}$
                - name: redirect_uri
                  in: formData
                  description: Exact redirect used in the authorization request
                  required: true
                  type: string
                  format: uri
                - name: resource
                  in: formData
                  description: Exact resource for which the token is requested
                  required: true
                  type: string
                  format: uri
                - name: grant_type
                  in: formData
                  description: Authorization-code grant selected by this operation
                  required: false
                  type: string
                  default: authorization_code
                  enum:
                    - authorization_code
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BearerToken'
                        required:
                            - access_token
                            - token_type
            schemes:
                - http
    /introspect:
        post:
            tags:
                - token_introspection
            summary: read token_introspection
            description: Authenticate the resource server and submit one access token in a generated form, then decode the issuer's current activity, audience and granted permissions.
            operationId: token_introspection#read
            consumes:
                - application/x-www-form-urlencoded
            parameters:
                - name: token
                  in: formData
                  description: Bearer access token submitted for verification
                  required: true
                  type: string
                  minLength: 1
                  pattern: ^[A-Za-z0-9._~+/-]+=*$
                - name: token_type_hint
                  in: formData
                  description: Access-token lookup hint; the issuer still owns token-purpose verification
                  required: false
                  type: string
                  default: access_token
                  enum:
                    - access_token
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/TokenIntrospectionReadResponseBody'
                        required:
                            - active
            schemes:
                - http
            security:
                - introspection_credentials_header_Authorization: []
    /issuer:
        get:
            tags:
                - issuer_metadata
            summary: read issuer_metadata
            description: Read issuer metadata and bind it to the exact configured issuer before sending a secret to its token endpoint.
            operationId: issuer_metadata#read
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/IssuerMetadataReadResponseBody'
                        required:
                            - issuer
                            - token_endpoint
            schemes:
                - http
    /refresh:
        post:
            tags:
                - access_tokens
            summary: refresh access_tokens
            description: Replace an expired public-client access token using the refresh credential bound to the same issuer and resource.
            operationId: access_tokens#refresh
            consumes:
                - application/x-www-form-urlencoded
            parameters:
                - name: client_id
                  in: formData
                  description: Public client identifier of the original grant
                  required: true
                  type: string
                  minLength: 1
                - name: refresh_token
                  in: formData
                  description: Private refresh credential from the original grant
                  required: true
                  type: string
                  minLength: 1
                  pattern: ^[\x20-\x7e]+$
                - name: resource
                  in: formData
                  description: Exact resource of the original grant
                  required: true
                  type: string
                  format: uri
                - name: grant_type
                  in: formData
                  description: Refresh grant selected by this operation
                  required: false
                  type: string
                  default: refresh_token
                  enum:
                    - refresh_token
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BearerToken'
                        required:
                            - access_token
                            - token_type
            schemes:
                - http
    /resource:
        get:
            tags:
                - resource_metadata
            summary: read resource_metadata
            description: Read the resource's metadata before choosing an issuer or sending a client credential.
            operationId: resource_metadata#read
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/ResourceMetadataReadResponseBody'
                        required:
                            - resource
                            - authorization_servers
            schemes:
                - http
    /token:
        post:
            tags:
                - access_tokens
            summary: secret access_tokens
            description: Exchange a preregistered client identifier and secret using request-body authentication for one resource and its configured permissions.
            operationId: access_tokens#secret
            consumes:
                - application/x-www-form-urlencoded
            parameters:
                - name: client_id
                  in: formData
                  description: Client identifier registered with this issuer
                  required: true
                  type: string
                  minLength: 1
                - name: client_secret
                  in: formData
                  description: Secret registered with this issuer
                  required: true
                  type: string
                  minLength: 1
                - name: resource
                  in: formData
                  description: Exact resource for which the token is requested
                  required: true
                  type: string
                  format: uri
                - name: scope
                  in: formData
                  description: Space-separated permissions requested by the configured client
                  required: false
                  type: string
                  pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
                - name: grant_type
                  in: formData
                  description: Client-credentials grant selected by this operation
                  required: false
                  type: string
                  default: client_credentials
                  enum:
                    - client_credentials
            responses:
                "200":
                    description: OK response.
                    schema:
                        $ref: '#/definitions/BearerToken'
                        required:
                            - access_token
                            - token_type
            schemes:
                - http
definitions:
    AccessTokenClaimsDecodeRequestBody:
        title: AccessTokenClaimsDecodeRequestBody
        type: object
        properties:
            aud:
                description: Resource identifiers decoded by the JWT library
                example: Voluptatem aut minima quia.
            client_id:
                type: string
                description: Client to which the access token was issued
                example: zse
                minLength: 1
            exp:
                type: number
                description: Exclusive token expiration in Unix seconds
                example: 0.9384970563171912
                format: double
            iat:
                type: number
                description: Token issue time in Unix seconds
                example: 0.635850949987135
                format: double
            iss:
                type: string
                description: Exact authorization server identifier
                example: "9"
                minLength: 1
            jti:
                type: string
                description: Token identifier assigned by the authorization server
                example: "9"
                minLength: 1
            nbf:
                type: number
                description: Inclusive first valid instant in Unix seconds
                example: 0.4731574477305462
                format: double
            scope:
                type: string
                description: Space-separated permissions granted by the issuer
                example: yC K
                pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
            sub:
                type: string
                description: Subject identified by the authorization server
                example: "y"
                minLength: 1
        example:
            aud: Voluptatem aut minima quia.
            client_id: zse
            exp: 0.9384970563171912
            iat: 0.635850949987135
            iss: "9"
            jti: "9"
            nbf: 0.4731574477305462
            scope: yC K
            sub: "y"
        required:
            - iss
            - sub
            - aud
            - exp
            - iat
            - jti
            - client_id
    BearerToken:
        title: BearerToken
        type: object
        properties:
            access_token:
                type: string
                description: Opaque bearer token returned by the issuer
                example: "5"
                pattern: ^[A-Za-z0-9._~+/-]+=*$
                minLength: 1
            expires_in:
                type: integer
                description: Access token lifetime in seconds from the token response
                example: 8654397654246435502
                format: int64
                minimum: 0
            refresh_token:
                type: string
                description: Private refresh credential; never sent to a resource server
                example: 5i2
                pattern: ^[\x20-\x7e]+$
                minLength: 1
            scope:
                type: string
                description: Space-separated permissions granted by the issuer
                example: c$
                pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
            token_type:
                type: string
                description: Bearer token type, compared without case sensitivity
                example: BEARER
                pattern: ^[Bb][Ee][Aa][Rr][Ee][Rr]$
        description: An opaque resource access token and the optional refresh credential issued in the same grant.
        example:
            access_token: "5"
            expires_in: 8654397654246435502
            refresh_token: 5i2
            scope: c$
            token_type: BEARER
        required:
            - access_token
            - token_type
    ClientMetadataReadResponseBody:
        title: ClientMetadataReadResponseBody
        type: object
        properties:
            client_id:
                type: string
                description: Exact HTTPS URL hosting this client document
                example: http://conroy.name/eden_prohaska
                format: uri
            client_name:
                type: string
                description: Client name shown by the issuer during consent
                example: 9s
                minLength: 1
            client_secret:
                type: string
                description: Forbidden shared-secret registration member checked by the client
                example: Aut ea facilis vitae excepturi.
            client_secret_expires_at:
                type: integer
                description: Forbidden shared-secret registration member checked by the client
                example: 6218087839042147539
                format: int64
            grant_types:
                type: array
                items:
                    type: string
                    example: Accusamus deserunt.
                description: Registered grants including authorization code and optional refresh
                default:
                    - authorization_code
                example:
                    - Accusamus deserunt.
                    - Voluptatibus quia itaque alias.
                    - Odit dolorem omnis eveniet.
            redirect_uris:
                type: array
                items:
                    type: string
                    example: http://baileyhintz.biz/major
                    format: uri
                description: Registered callbacks owned by the client host
                example:
                    - http://baileyhintz.biz/major
                minItems: 1
            response_types:
                type: array
                items:
                    type: string
                    example: Est ut rerum qui.
                description: Registered authorization responses
                default:
                    - code
                example:
                    - Est ut rerum qui.
                    - Id quas ex debitis rem rerum.
            token_endpoint_auth_method:
                type: string
                description: Public-client token authentication
                example: none
                enum:
                    - none
        example:
            client_id: http://conroy.name/eden_prohaska
            client_name: 9s
            client_secret: Aut ea facilis vitae excepturi.
            client_secret_expires_at: 6218087839042147539
            grant_types:
                - Accusamus deserunt.
                - Voluptatibus quia itaque alias.
                - Odit dolorem omnis eveniet.
            redirect_uris:
                - http://baileyhintz.biz/major
            response_types:
                - Est ut rerum qui.
                - Id quas ex debitis rem rerum.
            token_endpoint_auth_method: none
        required:
            - client_id
            - client_name
            - redirect_uris
            - token_endpoint_auth_method
    IssuerMetadataReadResponseBody:
        title: IssuerMetadataReadResponseBody
        type: object
        properties:
            authorization_endpoint:
                type: string
                description: HTTPS endpoint for user sign-in and consent
                example: http://haley.biz/ayden
                format: uri
            authorization_response_iss_parameter_supported:
                type: boolean
                description: Whether every authorization response must identify its issuer
                example: true
            client_id_metadata_document_supported:
                type: boolean
                description: Whether this issuer accepts HTTPS client metadata documents
                example: false
            code_challenge_methods_supported:
                type: array
                items:
                    type: string
                    example: Sed nam asperiores unde nobis.
                description: Advertised PKCE methods used to protect authorization codes
                example:
                    - Sed nam asperiores unde nobis.
                    - Ab quisquam.
            grant_types_supported:
                type: array
                items:
                    type: string
                    example: Qui voluptatem.
                description: Token grants supported by the issuer
                default:
                    - authorization_code
                    - implicit
                example:
                    - Qui voluptatem.
                    - Laboriosam itaque laudantium.
                    - Sed laboriosam voluptatibus earum autem doloremque natus.
                    - Similique vel est.
            issuer:
                type: string
                description: Exact identifier of the authorization server
                example: http://connelly.com/jane.volkman
                format: uri
            scopes_supported:
                type: array
                items:
                    type: string
                    example: 2a
                    pattern: ^[\x21\x23-\x5b\x5d-\x7e]+$
                description: Permissions that the issuer accepts, including optional offline access
                example:
                    - 2a
                    - '}'
                    - LD
                    - h.
            token_endpoint:
                type: string
                description: HTTPS endpoint that accepts token grants
                example: http://rempel.info/casey_ankunding
                format: uri
            token_endpoint_auth_methods_supported:
                type: array
                items:
                    type: string
                    example: Maxime est aut eius optio.
                description: Client authentication methods accepted at the token endpoint
                example:
                    - Maxime est aut eius optio.
                    - Non dicta architecto a voluptas ipsum et.
            token_endpoint_auth_signing_alg_values_supported:
                type: array
                items:
                    type: string
                    example: z
                    minLength: 1
                description: Signature algorithms accepted for signed client authentication; required only by a signed client profile
                example:
                    - z
                    - c
                    - "4"
        example:
            authorization_endpoint: http://haley.biz/ayden
            authorization_response_iss_parameter_supported: true
            client_id_metadata_document_supported: false
            code_challenge_methods_supported:
                - Sed nam asperiores unde nobis.
                - Ab quisquam.
            grant_types_supported:
                - Qui voluptatem.
                - Laboriosam itaque laudantium.
                - Sed laboriosam voluptatibus earum autem doloremque natus.
                - Similique vel est.
            issuer: http://connelly.com/jane.volkman
            scopes_supported:
                - 2a
                - '}'
                - LD
                - h.
            token_endpoint: http://rempel.info/casey_ankunding
            token_endpoint_auth_methods_supported:
                - Maxime est aut eius optio.
                - Non dicta architecto a voluptas ipsum et.
            token_endpoint_auth_signing_alg_values_supported:
                - z
                - c
                - "4"
        required:
            - issuer
            - token_endpoint
    ResourceMetadataReadResponseBody:
        title: ResourceMetadataReadResponseBody
        type: object
        properties:
            authorization_servers:
                type: array
                items:
                    type: string
                    example: http://wiegand.org/faustino_graham
                    format: uri
                description: Issuers trusted by this resource
                example:
                    - http://wiegand.org/faustino_graham
                    - http://green.net/maeve.torphy
                    - http://lueilwitz.name/wiley_ferry
                minItems: 1
            resource:
                type: string
                description: Exact identifier of the protected resource
                example: http://torphycummerata.info/joey
                format: uri
            scopes_supported:
                type: array
                items:
                    type: string
                    example: '{'
                    pattern: ^[\x21\x23-\x5b\x5d-\x7e]+$
                description: Permissions supported by this resource
                example:
                    - '{'
                    - '{d'
        example:
            authorization_servers:
                - http://wiegand.org/faustino_graham
                - http://green.net/maeve.torphy
                - http://lueilwitz.name/wiley_ferry
            resource: http://torphycummerata.info/joey
            scopes_supported:
                - '{'
                - '{d'
        required:
            - resource
            - authorization_servers
    TokenIntrospectionReadResponseBody:
        title: TokenIntrospectionReadResponseBody
        type: object
        properties:
            active:
                type: boolean
                description: Whether this token is currently usable by the authenticated resource
                example: true
            aud:
                description: Intended resource identifiers decoded by the JWT library
                example: Voluptas soluta.
            client_id:
                type: string
                description: Client to which the access token was issued when supplied
                example: s
                minLength: 1
            exp:
                type: integer
                description: Exclusive token expiration in whole Unix seconds when supplied
                example: 2961581614934032011
                format: int64
            iss:
                type: string
                description: Exact authorization server identifier when supplied
                example: r7w
                minLength: 1
            nbf:
                type: integer
                description: Inclusive first valid instant in whole Unix seconds when supplied
                example: 8924386129086123817
                format: int64
            scope:
                type: string
                description: Space-separated permissions granted for this resource
                example: iT l <
                pattern: ^[\x21\x23-\x5b\x5d-\x7e]+( [\x21\x23-\x5b\x5d-\x7e]+)*$
            sub:
                type: string
                description: Subject identified by the authorization server when supplied
                example: 8jz
                minLength: 1
            token_type:
                type: string
                description: Bearer token type when supplied
                example: BEARER
                pattern: ^[Bb][Ee][Aa][Rr][Ee][Rr]$
        example:
            active: true
            aud: Voluptas soluta.
            client_id: s
            exp: 2961581614934032011
            iss: r7w
            nbf: 8924386129086123817
            scope: iT l <
            sub: 8jz
            token_type: BEARER
        required:
            - active
securityDefinitions:
    introspection_credentials_header_Authorization:
        type: basic
