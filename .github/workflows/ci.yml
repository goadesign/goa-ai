name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          go mod download
          go build ./...

      - name: Install developer tools
        run: ./scripts/setup

      - name: Install Goa CLI
        run: |
          go install goa.design/goa/v3/cmd/goa@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint (golangci-lint v2)
        run: |
          make lint
        if: success()

      - name: Run unit tests
        run: |
          make test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Install developer tools
        run: ./scripts/setup

      # The Makefile itest target is the single source of truth for the
      # integration lane: end-to-end scenarios plus Docker-backed tests.
      - name: Run integration tests
        run: |
          make itest
