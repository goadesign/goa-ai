name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          go mod download
          go build ./...

      - name: Install developer tools
        run: ./scripts/setup

      - name: Install Goa CLI
        run: |
          go install goa.design/goa/v3/cmd/goa
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint (golangci-lint v2)
        run: |
          make lint
        if: success()

      - name: Run unit tests
        run: |
          make test-unit

  mcp-generated:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      - name: Install developer tools
        run: ./scripts/setup

      - name: Verify assigned MCP tests
        run: bash ./scripts/test-mcp ${{ matrix.shard }}

  mcp-apps:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration_tests/apps
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: integration_tests/apps/fixture/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: integration_tests/apps/package-lock.json

      - name: Install example dependencies
        run: npm ci

      - name: Cache pinned Chromium
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: mcp-apps-${{ runner.os }}-${{ hashFiles('integration_tests/apps/package-lock.json') }}

      - name: Install headless browser and system dependencies
        run: npx playwright install chromium --only-shell --with-deps

      - name: Check and prepare example once
        run: |
          npm run check
          npm run prepare:fixture

      - name: Verify Apps host permissions and browser isolation
        run: npm test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
          cache-dependency-path: go.sum

      - name: Install developer tools
        run: ./scripts/setup

      # The Makefile itest target is the single source of truth for the
      # integration lane: end-to-end scenarios plus Docker-backed tests.
      - name: Run integration tests
        run: |
          make itest
