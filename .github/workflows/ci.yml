name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      - name: Verify build
        run: |
          go mod download
          go build ./...

      - name: Install protoc (for make tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install developer tools
        run: |
          make tools

      - name: Install Goa CLI
        run: |
          go install goa.design/goa/v3/cmd/goa@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint (golangci-lint v2)
        run: |
          make lint
        if: success()

      - name: Run unit tests
        run: |
          make test

  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true
          cache-dependency-path: go.sum

      # make itest only requires protoc on PATH (see the Makefile protoc-check
      # target), and the sole proto in this repo is plain proto3, so the
      # distribution compiler is sufficient. Resolving "latest" through the
      # unauthenticated GitHub API instead made this lane fail whenever the
      # API rate-limited the runner: the version resolved empty and the
      # download was an error page rather than an archive.
      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install protoc plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.35.1
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1

      # The Makefile itest target is the single source of truth for the
      # integration lane: end-to-end scenarios plus Docker-backed tests.
      - name: Run integration tests
        run: |
          make itest
